syntax = "proto3";

package filestudio.v1;

option java_package = "com.filestudio.grpc";
option java_multiple_files = true;

// FileStudio 核心 gRPC 服务定义（Phase 0 仅定义，代码生成留待后续阶段接入）。
service FileStudioService {
  // 打开/解析文件
  rpc OpenFile(OpenFileRequest) returns (OpenFileResponse);
  // 保存文档
  rpc SaveFile(SaveFileRequest) returns (SaveFileResponse);
  // 列出所有支持格式
  rpc ListFormats(ListFormatsRequest) returns (ListFormatsResponse);
  // 获取文件元数据
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
}

message OpenFileRequest {
  string path = 1;
}
message OpenFileResponse {
  string mime_type = 1;
  string extension = 2;
  string content = 3;
  int64 size = 4;
  string edit_capability = 5;
  map<string, string> metadata = 6;
}

message SaveFileRequest {
  string path = 1;
  string content = 2;
  string mime_type = 3;
}
message SaveFileResponse {
  bool ok = 1;
  int64 bytes_written = 2;
}

message ListFormatsRequest {}
message FormatInfo {
  string extension = 1;
  string mime_type = 2;
  string edit_capability = 3;
  string description = 4;
}
message ListFormatsResponse {
  repeated FormatInfo formats = 1;
}

message GetMetadataRequest {
  string path = 1;
}
message GetMetadataResponse {
  map<string, string> metadata = 1;
}
