org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 注意：不要在此硬编码 org.gradle.java.installations.paths。
# JDK 21 工具链由 settings.gradle.kts 中的 foojay-resolver-convention 自动解析，
# 构建 JVM 本身为 21 时会直接复用，无需指定路径。
# 如需指向本机离线安装的 JDK，请写入 ~/.gradle/gradle.properties（不提交到仓库）。

kotlin.code.style=official
