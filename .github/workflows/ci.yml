name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新提交会取消仍在排队/运行中的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 覆盖换行符与路径分隔符相关行为，Linux 覆盖常规环境
        os: [ windows-latest, ubuntu-latest ]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        # GitHub Actions runner 的内存比本地充裕，这里用默认参数即可
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: core-java21/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-${{ matrix.os }}
          path: core-java21/build/docs/javadoc/
          if-no-files-found: ignore
